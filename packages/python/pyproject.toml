[project]
name = "agentkit-merchant"
version = "1.0.0"
description = "Server-side SDK for integrating an AgentKit trust kernel."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["cryptography>=41.0"]
keywords = ["agentkit", "agentic-commerce", "razorpay", "mandate", "mcp"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentkit*"]

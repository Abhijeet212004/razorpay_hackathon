name: test

on: [push, pull_request]

jobs:
  suite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: node scripts/invariants.mjs

  # INV-22: replay mode runs end to end with zero external credentials. This job has no
  # secrets configured, which is the point.
  replay-no-credentials:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --wait
      - run: make seed-check
      - run: make creds
      - run: docker compose down -v

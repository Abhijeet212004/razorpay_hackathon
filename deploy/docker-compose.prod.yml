# Production overlay.
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d
#
# What it changes:
#   1. Caddy terminates TLS and is the only thing listening on the internet.
#   2. Every other published port is withdrawn. Postgres and Mongo become reachable only
#      from inside the compose network, which is where they should have been all along.
#   3. TRUST_PROXY is on, because the client address now arrives in a header. Without it
#      every rate limit sees one IP and either lets everything through or blocks everyone.
#   4. Restart policies, so a reboot brings the system back.
#
# It changes no credential and no default. Those come from .env.production.

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SHOP_DOMAIN: ${SHOP_DOMAIN:?set SHOP_DOMAIN}
      KERNEL_DOMAIN: ${KERNEL_DOMAIN:?set KERNEL_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      kernel:
        condition: service_healthy
      storefront:
        condition: service_healthy

  # Withdrawn from the internet. Reachable only across the compose network.
  postgres:
    restart: unless-stopped
    ports: !override []

  mongo:
    restart: unless-stopped
    ports: !override []

  kernel:
    restart: unless-stopped
    ports: !override []

  executor:
    restart: unless-stopped

  worker:
    restart: unless-stopped

  storefront:
    restart: unless-stopped
    ports: !override []

  web:
    restart: unless-stopped
    ports: !override []

  buyer-agent:
    restart: unless-stopped
    ports: !override []

volumes:
  caddy-data:
  caddy-config:
